name: Build and phase checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run build:csharp
      - run: dotnet build csharp/Tcp.ProtocolFixture/Tcp.ProtocolFixture.csproj -c Release
      - run: npm run test:csharp
      - run: npm run check-public -- --history
      - run: npm run compile
      - run: npm run test:unit
      - run: npm run measure:csharp

  extension-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run build:csharp
      - run: dotnet build csharp/Tcp.ProtocolFixture/Tcp.ProtocolFixture.csproj -c Release
      - run: npm test
