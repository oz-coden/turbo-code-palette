name: Build and phase checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run build:csharp
      - run: dotnet build csharp/Tcp.ProtocolFixture/Tcp.ProtocolFixture.csproj -c Release
      - run: npm run test:csharp
      - run: npm run check-public -- --history
      - run: npm run compile
      - run: npm run test:unit
      - run: npm run measure:csharp

  extension-host:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        code: ['1.134.0', '1.142.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run build:csharp
      - run: dotnet build csharp/Tcp.ProtocolFixture/Tcp.ProtocolFixture.csproj -c Release
      - run: npm run compile-tests && npm run compile
      - if: runner.os != 'Linux'
        run: npm test --ignore-scripts -- --code-version ${{ matrix.code }}
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm test --ignore-scripts -- --code-version ${{ matrix.code }}
      - run: npm run package:vsix
      - if: runner.os != 'Linux'
        run: node scripts/ci-installed.mjs ${{ matrix.code }}
      - if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/ci-installed.mjs ${{ matrix.code }}
